<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danilo Aluguel de Motos | Ho Chi Minh</title>
    <style>
        :root {
            --primary: #f39c12;      /* Amarelo Ouro / Alerta */
            --dark-bg: #1e272e;     /* Grafite Escuro */
            --card-bg: #2f3640;     /* Grafite Médio */
            --light-text: #f5f6fa;  /* Texto Claro */
            --body-bg: #111417;     /* Fundo Geral */
            --accent: #e74c3c;       /* Detalhes de Alerta/Remover */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--body-bg);
            color: var(--light-text);
            line-height: 1.6;
        }

        /* Topo da Página */
        header {
            background-color: var(--dark-bg);
            padding: 20px;
            border-bottom: 3px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo span {
            color: var(--primary);
        }

        /* Banner Principal (Hero) */
        .hero {
            background: linear-gradient(rgba(17, 20, 23, 0.75), rgba(17, 20, 23, 0.85)), url('https://unsplash.com') no-repeat center center/cover;
            height: 35vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero h2 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: white;
            text-transform: uppercase;
        }

        .hero p {
            font-size: 1.1rem;
            color: #dcdde1;
        }

        /* Grid Principal */
        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2.5fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* Sessão de Motos e Filtro */
        .section-title {
            font-size: 1.5rem;
            text-transform: uppercase;
            margin-bottom: 20px;
            border-left: 5px solid var(--primary);
            padding-left: 10px;
        }

        .filter-bar {
            background-color: var(--dark-bg);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .filter-bar label {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .filter-bar select {
            padding: 8px 12px;
            border-radius: 4px;
            background-color: var(--card-bg);
            color: white;
            border: 1px solid #485460;
            outline: none;
            cursor: pointer;
        }

        .grid-motos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .moto-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
            border: 1px solid #485460;
        }

        .moto-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
        }

        .moto-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .moto-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .moto-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            margin-bottom: 5px;
        }

        .moto-details {
            font-size: 0.85rem;
            color: #dcdde1;
            margin-bottom: 15px;
        }

        .moto-price-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-tag {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary);
        }

        .btn-select {
            background-color: var(--primary);
            color: var(--dark-bg);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .btn-select:hover {
            opacity: 0.9;
        }

        /* Lateral - Orçamento e Reserva */
        .booking-panel {
            background-color: var(--dark-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            height: fit-content;
            position: sticky;
            top: 100px;
            border: 1px solid #485460;
        }

        .booking-panel h3 {
            font-size: 1.2rem;
            text-transform: uppercase;
            margin-bottom: 15px;
            border-bottom: 1px solid #485460;
            padding-bottom: 10px;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #dcdde1;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            background-color: var(--card-bg);
            color: white;
            border: 1px solid #485460;
            outline: none;
        }

        .summary-box {
            background-color: var(--body-bg);
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 0.95rem;
            border: 1px solid #485460;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            border-top: 2px dashed #485460;
            padding-top: 10px;
            margin-top: 10px;
            color: var(--primary);
        }

        .btn-book {
            width: 100%;
            background-color: var(--primary);
            color: var(--dark-bg);
            border: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-book:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <div class="header-container">
            <div class="logo">
                <h1>Danilo <span>Aluguel de Motos</span></h1>
            </div>
        </div>
    </header>

    <!-- Banner -->
    <section class="hero">
        <div>
            <h2>Explore Ho Chi Minh sobre duas rodas</h2>
            <p>A forma mais rápida, barata e emocionante de rodar e viver a cidade.</p>
        </div>
    </section>

    <!-- Estrutura Principal -->
    <div class="main-container">
        
        <!-- Vitrine de Motos -->
        <main>
            <h2 class="section-title">Escolha sua Moto</h2>

            <!-- Barra de Filtro por Tipo -->
            <div class="filter-bar">
                <label for="categoryFilter">Categoria:</label>
                <select id="categoryFilter" onchange="filterMotos()">
                    <option value="all">Todas as Categorias</option>
                    <option value="scooter">Scooters (Automáticas)</option>
                    <option value="trail">Trail / Aventura</option>
                    <option value="street">Street / Urbana</option>
                </select>
            </div>

            <div id="gridMotos" class="grid-motos">
                <!-- Inserido dinamicamente via JS -->
            </div>
        </main>

        <!-- Painel Lateral de Simulação -->
        <aside class="booking-panel">
            <h3>Simular Aluguel</h3>
            <div class="form-group">
                <label>Modelo Selecionado</label>
                <input type="text" id="selectedBike" value="Nenhuma selecionada" readonly style="opacity: 0.7;">
            </div>
            <div class="form-group">
                <label for="daysInput">Quantidade de Dias</label>
                <input type="number" id="daysInput" min="1" value="1" oninput="calculateTotal()">
            </div>

            <div class="summary-box">
                <div class="summary-row">
                    <span>Preço por Dia:</span>
                    <span id="summaryPrice">R$ 0,00</span>
                </div>
                <div class="summary-total">
